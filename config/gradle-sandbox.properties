# =====================================================================
# profile: sandbox —— 云端沙箱 / CI 环境（本仓库的构建机器）
# 激活方式：gradle -Pprofile=sandbox buildPlugin
# =====================================================================

# 沙箱需通过本地代理访问外网（依赖下载 / IDE 发行包下载）
proxy.enabled=true
http.proxyHost=127.0.0.1
http.proxyPort=18080
https.proxyHost=127.0.0.1
https.proxyPort=18080
nonProxyHosts=localhost|127.0.0.1|*.svc|*.cluster.local|::1

# 沙箱环境的 JDK 17 路径（构建启动时校验当前 JVM 是否为此路径）
jdkHome=/root/.local/share/mise/installs/java/17.0.2

# 可选：本机已缓存/解压的 IDE 发行包目录（本沙箱已缓存，可不配）
# ide.localPath=
