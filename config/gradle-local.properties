# =====================================================================
# profile: local —— 本地开发机（默认）
# 激活方式：gradle.profile=local（gradle.properties 默认值），或 gradle -Pprofile=local
# =====================================================================

# 是否启用 HTTP/HTTPS 代理（本地直连一般不需要，保持 false）
proxy.enabled=false

# JDK 路径：本地用 IDEA 开发时【留空即可】，不要写死机器路径。
# 原因：构建实际用的 JDK 由 IDEA 决定 ——
#   Settings → Build, Execution, Deployment → Build Tools → Gradle → Gradle JVM（选 JDK 17）
# 也就是说 JDK 配置在 IDEA 里，profile 里再写路径反而容易和 IDEA 不一致导致误报。
#
# ⚠️ 若真需要填，路径必须用「正斜杠 /」，不要用「反斜杠 \」：
#   .properties 文件里 \ 是转义符，C:\Program Files\... 会被解析成乱码路径。
#
# jdkHome 只在两种情况下需要填：
#   1) 走 scripts/gradle.sh（Linux / CI 沙箱，无 IDEA 管理 JDK）时，用它选择 Gradle 的 JVM；
#   2) 命令行直接构建时不想依赖环境变量。
# 示例：Linux jdkHome=/usr/lib/jvm/java-17-openjdk-amd64
#
# 说明：即使留空，settings.gradle.kts 仍会校验「构建 JVM 版本必须在 11~17」，
#      用 JDK 25 等新版会报错并提示如何切换。
jdkHome=

# 可选：本地已解压的 IDEA Community 发行包目录。
# 配置后可跳过 Gradle 每次下载 600MB 的 IDE（国内下载很慢，强烈建议配置）。
# 国内镜像：https://download.jetbrains.com.cn/idea/ideaIC-2023.2.zip （解压后填绝对路径）
# ide.localPath=/opt/ideaIC-2023.2
