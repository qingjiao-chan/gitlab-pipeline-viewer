# =====================================================================
# 构建环境配置（模拟 Spring Boot 的 profile 机制）
# ---------------------------------------------------------------------
# 激活的构建 profile（类似 spring.profiles.active），默认 local。
# 命令行可用 -Pprofile=xxx 临时覆盖，例如：
#   gradle -Pprofile=sandbox buildPlugin
#
# 每个 profile 对应一个配置文件：config/gradle-<profile>.properties，
# 里面可配置：代理（proxy.*）、JDK 路径（jdkHome）、IDE 本地路径（ide.localPath）。
#
# 注意：这里不写任何机器相关的配置（JDK 路径 / 代理），
#       它们都按环境拆分到了 profile 文件中，换机器只换 profile，不用改本文件。
# =====================================================================
gradle.profile=local
